# Checks every push to main and every pull request: formatting, analysis,
# and tests for the three Dart packages, the Edge Function tests, the
# forecast data preparation tests, and a scan for keys that must never be
# committed (CLAUDE.md: no secrets in the repo).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyze and test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Get packages (whole workspace)
        run: flutter pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed apps packages
      - name: Generated translations are up to date
        run: |
          (cd apps/dashboard && flutter gen-l10n)
          (cd apps/mobile && flutter gen-l10n)
          git diff --exit-code -- apps/*/lib/src/l10n
      - name: Analyze
        run: |
          for dir in packages/shared apps/dashboard apps/mobile; do
            echo "::group::$dir"
            (cd "$dir" && flutter analyze) || exit 1
            echo "::endgroup::"
          done
      - name: Test shared package
        working-directory: packages/shared
        run: flutter test
      - name: Test dashboard
        working-directory: apps/dashboard
        run: flutter test
      - name: Test mobile app
        working-directory: apps/mobile
        run: flutter test

  functions:
    name: Edge Function tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: send-sms helpers and signature check
        run: node --test supabase/functions/send-sms/sms.test.ts
      - name: sms-intake codec (same vectors as the Dart codec) and helpers
        run: node --test supabase/functions/sms-intake/sms_intake.test.ts
      - name: send-alerts helpers, Firebase calls, and the handler (database, Semaphore, and FCM stood in)
        run: >
          node --test
          supabase/functions/send-alerts/alerts.test.ts
          supabase/functions/send-alerts/fcm.test.ts
          supabase/functions/send-alerts/index.test.ts

  forecast:
    name: Forecast data preparation and KDE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r ml/requirements-forecast.txt
      - name: Windows, split, class weights, KDE bandwidth, grid, and per-barangay averages
        working-directory: ml/forecast
        run: python -m unittest test_forecast -v

  secrets:
    name: No keys in the repo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: |
          # Supabase secret keys, filled-in publishable keys, and JWTs
          # (the legacy anon and service-role keys are JWTs).
          if git grep -nE 'sb_secret_[A-Za-z0-9]|sb_publishable_[A-Za-z0-9]|eyJhbGciOi[A-Za-z0-9_-]{10,}' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::A key-like value is committed. Move it to .env or Supabase secrets."
            exit 1
          fi
          echo "No key-like values found."
