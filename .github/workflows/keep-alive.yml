# Keeps the hosted Supabase project awake. On the free plan a project with
# no activity for 7 days is paused (Joshua, 2026-11-23). Once a day this
# calls public.client_config(), a read the publishable key may make, so the
# database itself answers a request.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL              https://<project>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the publishable (anon) key, never the secret one
#
# The response holds the hotline numbers, so only the status is printed:
# this repository's Actions logs are public.
#
# GitHub turns scheduled workflows off after 60 days without a commit in a
# public repository; it emails the owner first. Run it by hand from the
# Actions tab (Run workflow) to check it or to turn it back on.

name: keep-alive

on:
  schedule:
    - cron: "17 1 * * *" # every day, 09:17 Manila time
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the database
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY is not set"; exit 1
          fi
          for try in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -X POST \
              "$URL/rest/v1/rpc/client_config" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
            echo "try $try: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
