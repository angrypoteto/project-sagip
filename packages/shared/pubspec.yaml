name: sagip_shared
description: Shared models, design tokens, widgets, repository interfaces and mock data for Project S.A.G.I.P.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  intl: ^0.20.3
  latlong2: ^0.10.1
  material_symbols_icons: ^4.2960.0
  material_ui: ^1.5.0
  supabase: ^2.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    # Manila road graph for Dijkstra (ml/road_graph/build_road_graph.py).
    # Map data (c) OpenStreetMap contributors, ODbL 1.0.
    - assets/road_graph/manila_drive_v1.bin
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
