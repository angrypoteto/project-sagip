<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseline form replica</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!--
  A replica of MDRRMD's current online report forms (Emergency Medical
  Response Form, Flood Monitoring/Roving Form 2026, Fire Incident 2026),
  rebuilt from the PDF templates MDRRMD sent, for the S.A.G.I.P. Objective 4
  timed trial ("the current way"). Same questions, same order, same
  required fields; no MDRRMD branding. Not MDRRMD's form and sends nothing
  anywhere: answers and times stay in this browser.

  The timer starts at "Start" and stops when "Submit" passes the required
  checks. Results are kept in this browser and can be copied as CSV.
-->
<style>
  :root { --bg:#eef2f5; --card:#fff; --ink:#0f1c2a; --muted:#5b6b7b; --line:#d5dde5; --accent:#2e7cd6; --err:#c62d38; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:14px 16px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  .q { margin:18px 0 0; }
  .q > label.t, .q > .t { display:block; font-weight:600; font-size:14px; text-transform:uppercase; letter-spacing:.2px; }
  .req { color:var(--err); }
  .hint { color:var(--muted); font-size:13px; margin:2px 0 6px; white-space:pre-line; }
  input[type=text], input[type=number], input[type=datetime-local], select, textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
  textarea { min-height:90px; }
  .opts { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
  .opts label { display:flex; gap:8px; align-items:flex-start; border:1px solid var(--line); border-radius:6px; padding:10px; background:#f7fafc; font-size:14px; }
  .map { height:220px; border:1px solid var(--line); border-radius:6px; }
  .latlon { font-size:13px; color:var(--muted); margin-top:4px; }
  .err { color:var(--err); font-size:13px; margin-top:4px; }
  .q.bad input, .q.bad select, .q.bad textarea, .q.bad .opts, .q.bad .map { border-color:var(--err); }
  .patient { border-left:3px solid var(--line); padding-left:12px; margin-top:16px; }
  button { font:inherit; padding:12px 18px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .timer { font-variant-numeric:tabular-nums; font-weight:700; font-size:20px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { border-bottom:1px solid var(--line); padding:6px 4px; text-align:left; }
  .hidden { display:none; }
  .done { background:#e9f7ef; border:1px solid #9bd3b5; border-radius:8px; padding:12px; }
</style>
</head>
<body>
<header>
  <h1>Baseline form replica (Objective 4 timed trial)</h1>
  <p>A copy of the questions on MDRRMD's current EMR, flood and fire report forms, rebuilt from MDRRMD's PDF templates for timing. Not MDRRMD's form. Nothing is sent anywhere.</p>
</header>
<main>
  <div class="card">
    <div class="row">
      <label>Form
        <select id="formPick">
          <option value="emr">Emergency Medical Response Form</option>
          <option value="flood">Flood Monitoring/Roving Form 2026</option>
          <option value="fire">Fire Incident 2026</option>
        </select>
      </label>
      <label>Card
        <select id="cardPick">
          <option>EMR road accident 2 patients</option>
          <option>Flood knee deep</option>
          <option>Fire residential 2nd alarm</option>
          <option>Practice</option>
        </select>
      </label>
      <label>Participant <input type="text" id="who" placeholder="e.g. Responder A" style="width:160px"></label>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="startBtn">Start</button>
      <span class="timer" id="timer">0.0 s</span>
    </div>
  </div>

  <form id="form" class="card hidden" novalidate></form>

  <div id="done" class="card hidden"></div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <strong>Results in this browser</strong>
      <span class="row"><button id="csvBtn" type="button">Copy CSV</button><button id="clearBtn" type="button">Clear</button></span>
    </div>
    <table><thead><tr><th>#</th><th>Form</th><th>Card</th><th>Participant</th><th>Started</th><th>Seconds</th><th>Answered</th></tr></thead><tbody id="results"></tbody></table>
  </div>
</main>

const form = $('#form');
let answers = {}, maps = [], started = null, tick = null, current = 'emr';

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) e.append(c);
  return e;
}

function question(q, key) {
  const box = el('div', { class: 'q', 'data-key': key });
  box.append(el('div', { class: 't' }, q.t, q.req ? el('span', { class: 'req' }, '*') : null));
  if (q.hint) box.append(el('div', { class: 'hint' }, q.hint));
  const set = v => { answers[key] = v; box.classList.remove('bad'); render(true); };
  const val = answers[key];
  switch (q.k) {
    case 'text': box.append(el('input', { type: 'text', value: val ?? '', oninput: e => { answers[key] = e.target.value; box.classList.remove('bad'); } })); break;
    case 'textarea': { const t = el('textarea', { maxlength: '1000', oninput: e => { answers[key] = e.target.value; } }); t.value = val ?? ''; box.append(t); break; }
    case 'number': box.append(el('input', { type: 'number', min: '0', value: val ?? '', oninput: e => { answers[key] = e.target.value; } })); break;
    case 'datetime': box.append(el('input', { type: 'datetime-local', value: val ?? '', oninput: e => { answers[key] = e.target.value; box.classList.remove('bad'); } })); break;
    case 'select': {
      const s = el('select', { onchange: e => set(e.target.value) }, el('option', { value: '' }, '-Please select-'));
      for (const o of q.opts) { const op = el('option', { value: o }, o); if (o === val) op.selected = true; s.append(op); }
      box.append(s); break;
    }
    case 'radio': {
      const g = el('div', { class: 'opts' });
      for (const o of q.opts) {
        const r = el('input', { type: 'radio', name: key, value: o, onchange: () => set(o) });
        if (o === val) r.checked = true;
        g.append(el('label', {}, r, o));
      }
      box.append(g); break;
    }
    case 'map': {
      const m = el('div', { class: 'map' });
      const ll = el('div', { class: 'latlon' }, val ? `Lat: ${val[0].toFixed(6)}  Lon: ${val[1].toFixed(6)}` : 'No geometry captured yet.');
      box.append(m, ll);
      queueMicrotask(() => {
        const map = L.map(m).setView(val ?? [14.5995, 120.9842], val ? 17 : 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
        let marker = val ? L.marker(val).addTo(map) : null;
        map.on('click', e => {
          if (map.getZoom() < 15) { ll.textContent = 'Zoom in closer to set location.'; return; }
          const p = [e.latlng.lat, e.latlng.lng];
          answers[key] = p; box.classList.remove('bad');
          marker ? marker.setLatLng(p) : (marker = L.marker(p).addTo(map));
          ll.textContent = `Lat: ${p[0].toFixed(6)}  Lon: ${p[1].toFixed(6)}`;
        });
        maps.push(map);
      });
      break;
    }
    case 'photos': {
      const n = el('div', { class: 'latlon' }, `${(val ?? []).length} file(s)`);
      const i = el('input', { type: 'file', accept: 'image/*', multiple: '', onchange: e => {
        answers[key] = [...(answers[key] ?? []), ...[...e.target.files].map(f => f.name)];
        n.textContent = `${answers[key].length} file(s)`; box.classList.remove('bad');
      } });
      box.append(i, n); break;
    }
  }
  box.append(el('div', { class: 'err hidden' }));
  return box;
}

function visible(q) { return !q.when || q.when(answers); }

function render(keepScroll) {
  const y = window.scrollY;
  maps.forEach(m => m.remove()); maps = [];
  form.innerHTML = '';
  const f = FORMS[current];
  form.append(el('h2', {}, f.title));
  if (f.intro) form.append(el('p', { class: 'hint' }, f.intro));
  for (const q of f.sections) {
    if (q.h) { form.append(el('h3', {}, q.h)); continue; }
    if (q.patients) {
      const n = Number(answers.patients || 0);
      for (let p = 1; p <= n; p++) {
        const box = el('div', { class: 'patient' }, el('h3', {}, `PATIENT ${p}: PATIENT NO. ${p} DETAILS`));
        for (const pq of PATIENT) box.append(question(pq, `p${p}.${pq.id}`));
        form.append(box);
      }
      continue;
    }
    if (visible(q)) form.append(question(q, q.id));
  }
  form.append(el('div', { class: 'row', style: 'margin-top:20px' }, el('button', { type: 'submit', class: 'primary' }, 'Submit')));
  if (keepScroll) window.scrollTo(0, y);
}

function requiredMissing() {
  const missing = [];
  const f = FORMS[current];
  const check = (q, key) => {
    const v = answers[key];
    let ok = true;
    if (q.k === 'photos') {
      const c = (v ?? []).length;
      ok = c >= (q.min && (q.req || c > 0) ? q.min : 0) && (!q.max || c <= q.max);
      if (!q.req && c === 0) ok = true;
    } else if (q.req) ok = Array.isArray(v) ? v.length > 0 : (v ?? '').toString().trim() !== '';
    if (!ok) missing.push(key);
  };
  for (const q of f.sections) {
    if (q.h) continue;
    if (q.patients) { for (let p = 1; p <= Number(answers.patients || 0); p++) for (const pq of PATIENT) check(pq, `p${p}.${pq.id}`); continue; }
    if (visible(q)) check(q, q.id);
  }
  return missing;
}

form.addEventListener('submit', e => {
  e.preventDefault();
  if (!started) return;
  const missing = requiredMissing();
  document.querySelectorAll('.q').forEach(b => {
    const bad = missing.includes(b.dataset.key);
    b.classList.toggle('bad', bad);
    const er = b.querySelector('.err'); er.textContent = bad ? 'This field is required.' : ''; er.classList.toggle('hidden', !bad);
  });
  if (missing.length) { document.querySelector(`.q[data-key="${missing[0]}"]`).scrollIntoView({ block: 'center' }); return; }
  const ended = new Date();
  const seconds = (ended - started) / 1000;
  clearInterval(tick);
  const row = { form: current, card: $('#cardPick').value, who: $('#who').value.trim(), started: started.toISOString(), submitted: ended.toISOString(), seconds: Math.round(seconds * 10) / 10, answered: Object.values(answers).filter(v => v !== '' && v != null).length,
    // What was entered (photo file names only), to check it against the card.
    answers: JSON.parse(JSON.stringify(answers)) };
  const all = load(); all.push(row); save(all); list();
  form.classList.add('hidden');
  const d = $('#done'); d.classList.remove('hidden');
  d.innerHTML = '';
  d.append(el('div', { class: 'done' }, `Submitted. ${row.seconds} s from Start to Submit (${row.answered} answers).`));
  started = null; $('#startBtn').disabled = false;
  window.scrollTo(0, 0);
});

// Each card belongs to one form: picking the card picks its form.
const cardForm = { 'EMR road accident 2 patients': 'emr', 'Flood knee deep': 'flood', 'Fire residential 2nd alarm': 'fire' };
$('#cardPick').addEventListener('change', e => { const f = cardForm[e.target.value]; if (f) $('#formPick').value = f; });

$('#startBtn').addEventListener('click', () => {
  current = $('#formPick').value; answers = {};
  $('#done').classList.add('hidden'); form.classList.remove('hidden');
  render(false);
  started = new Date(); $('#startBtn').disabled = true;
  clearInterval(tick);
  tick = setInterval(() => { $('#timer').textContent = `${((new Date() - started) / 1000).toFixed(1)} s`; }, 100);
});

// ------------------------------------------------------------------ results
function load() { try { return JSON.parse(localStorage.getItem('baselineRuns') || '[]'); } catch { return []; } }
function save(a) { try { localStorage.setItem('baselineRuns', JSON.stringify(a)); } catch {} }
function list() {
  const tb = $('#results'); tb.innerHTML = '';
  load().forEach((r, i) => tb.append(el('tr', {}, ...[i + 1, r.form, r.card, r.who, r.started.slice(11, 19), r.seconds, r.answered].map(v => el('td', {}, String(v))))));
}
$('#csvBtn').addEventListener('click', async () => {
  const rows = load();
  const csv = ['form,card,participant,started,submitted,seconds,answered,answers', ...rows.map(r => [r.form, r.card, r.who, r.started, r.submitted, r.seconds, r.answered, JSON.stringify(r.answers ?? {})].map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))].join('\n');
  try { await navigator.clipboard.writeText(csv); alert('Copied.'); } catch { prompt('Copy the CSV:', csv); }
});
$('#clearBtn').addEventListener('click', () => { if (confirm('Clear all results in this browser?')) { save([]); list(); } });
list();
</script>
</body>
