name: sagip_mobile
description: S.A.G.I.P. Android app for Manila residents and MDRRMD field rescue personnel.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.2

dependencies:
  connectivity_plus: ^7.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  http: ^1.6.0
  intl: ^0.20.3
  latlong2: ^0.10.1
  material_symbols_icons: ^4.2960.0
  material_ui: ^1.5.0
  permission_handler: ^13.0.2
  sagip_shared:
    path: ../../packages/shared
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
